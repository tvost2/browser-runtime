<!doctype html>
<meta charset="utf-8">
<title>Browser Runtime vs Babylon.js — vitrine GLBs</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0d12; color: #cdd6e4;
    font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
    -webkit-text-size-adjust: 100%; }
  header { display: flex; gap: 10px 14px; align-items: center; padding: 6px 14px;
    border-bottom: 1px solid #1c2430; min-height: 46px; flex: none; flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
  select { max-width: 240px; }
  select, button { background: #141b26; color: #cdd6e4; border: 1px solid #2a3646;
    border-radius: 6px; padding: 6px 10px; font: inherit; }
  button { cursor: pointer; }
  button:hover { background: #1b2534; }
  .hint { color: #4a5b70; font-size: 11px; }
  body { display: flex; flex-direction: column; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1c2430; flex: 1; min-height: 0; }
  .pane { position: relative; background: #0a0d12; overflow: hidden; min-height: 0; }
  .pane canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .tag { position: absolute; top: 10px; left: 12px; font-weight: 700; font-size: 12px;
    letter-spacing: .4px; padding: 3px 8px; border-radius: 5px; user-select: none; }
  .tag.wasm { background: #10331f; color: #6ee7a0; }
  .tag.bab { background: #331025; color: #f0a; }
  .stats { position: absolute; left: 10px; bottom: 10px; font: 11px/1.5 ui-monospace, monospace;
    white-space: pre; color: #aebfd2; user-select: none; pointer-events: none;
    background: rgba(6, 9, 14, .72); padding: 6px 9px; border-radius: 6px;
    border: 1px solid #1c2430; max-width: calc(100% - 20px); overflow: hidden; }
  .adv { position: absolute; right: 10px; top: 10px; max-width: 46%; text-align: right;
    font-size: 11px; color: #7f93aa; user-select: none; pointer-events: none; }
  .adv b { color: #cdd6e4; }
  .note { position: absolute; left: 10px; right: 10px; top: 40px;
    background: rgba(26, 34, 51, .94); border: 1px solid #3a4660;
    color: #cdd6e4; padding: 8px 30px 8px 11px; border-radius: 8px; font-size: 11px; line-height: 1.5;
    display: none; }
  .note.show { display: block; }
  .note b { color: #ffd479; }
  .note .x { position: absolute; right: 7px; top: 5px; cursor: pointer; color: #7f93aa;
    font-size: 15px; line-height: 1; padding: 2px 5px; }
  .note .x:hover { color: #cdd6e4; }
  #err { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); background: #3a1520;
    color: #ffb4c4; padding: 8px 14px; border-radius: 6px; display: none; z-index: 9;
    max-width: 92%; font-size: 12px; }
  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    header { min-height: 0; padding: 6px 10px; gap: 8px; }
    header h1 { font-size: 12px; }
    header h1 span { display: none; }
    header .hint { display: none; }
    .adv { display: none; }
    .stats { font-size: 10px; bottom: 8px; left: 8px; }
    .note { font-size: 10px; top: 8px; }
  }
</style>
<header>
  <h1>Browser Runtime <span style="color:#5a6b80">(C++/WASM + WebGPU)</span> &nbsp;vs&nbsp; Babylon.js</h1>
  <select id="model"></select>
  <button id="reload">reload both</button>
  <label style="color:#7f93aa"><input type="checkbox" id="spin" checked> girar</label>
  <span class="hint">arraste p/ girar · scroll/pinça p/ zoom — move os dois panes juntos · esquerda C++/WASM+WebGPU, direita JS+WebGL (esquerda precisa de GPU real)</span>
  <span id="dir" class="hint" style="margin-left:auto"></span>
</header>
<div id="err"></div>
<div class="grid">
  <div class="pane">
    <div class="tag wasm">BROWSER RUNTIME</div>
    <div class="adv" id="advL"></div>
    <canvas id="cL"></canvas>
    <div class="stats" id="sL">loading…</div>
    <div class="note" id="noteL"></div>
  </div>
  <div class="pane">
    <div class="tag bab">BABYLON.JS</div>
    <div class="adv" id="advR"></div>
    <canvas id="cR"></canvas>
    <div class="stats" id="sR">loading…</div>
  </div>
</div>
<script type="module" src="./vitrine-compare.mjs"></script>
